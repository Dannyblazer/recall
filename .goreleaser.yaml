version: 2

project_name: recall

before:
  hooks:
    - go mod tidy

builds:
  - id: recall
    binary: recall
    main: ./cmd/recall
    env:
      - CGO_ENABLED=0   # modernc.org/sqlite is pure Go — no CGO needed
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - id: recall-archive
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: recall-deb
    package_name: recall
    file_name_template: >-
      {{ .ConventionalFileName }}
    vendor: Daniel Nnaji
    homepage: https://github.com/Dannyblazer/recall
    maintainer: Daniel Nnaji nnajidanny004@gmail.com
    description: >-
      A persistent, searchable shell command history tool for Bash, Zsh,
      and Fish — backed by SQLite with optional cloud sync/backup.
    license: MIT
    formats:
      - deb
    bindir: /usr/bin
    contents:
      - src: ./README.md
        dst: /usr/share/doc/recall/README.md

signs:
  - cmd: gpg
    signature: "${artifact}.sig"
    args:
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--passphrase"
      - "{{ .Env.GPG_PASSPHRASE }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    artifacts: checksum

release:
  github:
    owner: Dannyblazer
    name: recall
  draft: false

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"